<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include header.html %}

    <main id="main-content">
        {{ content }}

        <!--
            Bookshop components are accessed using the bookshop tag,
            using the same syntax as the standard Jekyll include tag.
        -->
        {% bookshop_include page content_blocks=page.content_blocks page_theme=page.page_theme %}
    </main>

    <button class="top" type="button" title="Back to top" aria-label="Back to top" hidden>
        <i class="ion ion-ios-arrow-up" aria-hidden="true"></i>
    </button>

    {% include footer.html %}

    <script src="{{ '/js/vendor/lightense.min.js' | relative_url }}"></script>
    <script src="{{ '/js/common.js' | relative_url }}"></script>
    <script src="{{ '/js/publications.js' | relative_url }}"></script>
    <script src="{{ '/js/updates-filter.js' | relative_url }}"></script>
    <script src="{{ '/js/spotlight.js' | relative_url }}"></script>
    <script src="{{ '/js/trajectory.js' | relative_url }}"></script>
</body>

</html>
