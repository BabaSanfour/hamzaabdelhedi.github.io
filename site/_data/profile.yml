short_bio: >-
  <p>
    Supervised by <strong>Dr. Karim Jerbi</strong>. Broadly interested in the neural correlates of
    <strong>decision-making</strong> and <strong>brain disorders</strong>, and how psychoactive substances modulate
    underlying states through the lens of EEG/MEG, neural complexity, modeling, and <strong>AI</strong>.
  </p>

  <p>
    Currently building pipelines for large-scale neuroimaging datasets, leveraging AI tools to investigate
    <strong>ADHD</strong> and <strong>Epilepsy</strong>. In parallel, investigating perceptual decision-making and how
    <strong>brain complexity</strong> relates to choice behavior and cognitive traits.
  </p>

  <p>
    A fan of <strong>open &amp; accessible science</strong>, and building shareable tools to lower research barriers.
    Working to foster fairness and equity within the scientific community.
  </p>

  <p>
    Originally from Sfax 🇹🇳, now based in <strong>Tiohtià:ke / Montréal</strong> 🇨🇦. Pronouns: <em>he/him</em>.
  </p>
