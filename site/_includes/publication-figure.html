{% assign figure = include.figure %}
{% if figure.src and figure.src != empty %}
<figure class="publication-figure" id="publication-figure">
  <a class="publication-figure__image-link" href="{{ figure.full_src | default: figure.src | relative_url | escape }}" aria-label="View full-size figure: {{ figure.title | escape }}">
    <img src="{{ figure.src | relative_url | escape }}"
      {% if figure.sources %}srcset="{% for source in figure.sources %}{{ source.src | relative_url | escape }} {{ source.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="(max-width: 576px) calc(100vw - 58px), (max-width: 1180px) calc(100vw - 74px), 1082px"{% endif %}
      width="{{ figure.width }}" height="{{ figure.height }}"
      alt="{{ figure.alt | escape }}" loading="lazy" decoding="async">
  </a>
  <figcaption>
    <p><strong>{{ figure.title | escape }}.</strong> {{ figure.caption | escape }}</p>
    <p class="publication-figure__attribution">{{ figure.credit | escape }} · <a href="{{ figure.source_url | escape }}">{{ figure.source_label | escape }}</a>{% if figure.license and figure.license_url %} · <a href="{{ figure.license_url | escape }}">{{ figure.license | escape }}</a>{% endif %}. Resized; full frame preserved.</p>
    <a class="publication-figure__full-size" href="{{ figure.full_src | default: figure.src | relative_url | escape }}">View full-size figure <span aria-hidden="true">↗</span></a>
  </figcaption>
</figure>
{% endif %}
