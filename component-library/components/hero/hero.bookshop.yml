# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  phonetic:
    type: text
    comment: Phonetic pronunciation (e.g., HAM-za ab-del-HE-di)
  eyebrow:
    type: text
    comment: Short field and methods line above the name
  statement:
    type: text
    comment: One sentence stating the central research question
  position:
    type: text
    comment: Your title/position line
  tagline:
    type: textarea
    comment: One-line tagline summarizing your work/values
  circular_image:
    type: switch
  show_social_icons:
    type: switch
    comment: Show social icons from _data/links.yml
  email:
    type: email
    comment: Email address for contact icon
  cv_button:
    type: text
  cv_button_link:
    type: url
