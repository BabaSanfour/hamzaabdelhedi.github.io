preview:
  title: Hamza Abdelhedi
  phonetic: HAM-za ab-del-HE-di
  eyebrow: Computational Neuroscience · MEG/EEG · Open Science
  position: Graduate Research Assistant
  statement: I study how the human brain transforms changing sensory evidence into decisions and actions.
