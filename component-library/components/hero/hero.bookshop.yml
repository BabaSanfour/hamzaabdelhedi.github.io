preview:
  title: Hi 👋, I'm Hamza
  phonetic: HAM-za ab-del-HE-di
  pronouns: he/him
  position: PhD student in Biomedical Engineering
  statement: Building things at the intersection of bits 🤖, brains 🧠, and Open-Source 💻.
  description_html: >-
    <p>I study how the human brain transforms changing sensory evidence into decisions and actions. With Prof. Karim Jerbi, I use MEG/EEG and computational modeling to follow neural dynamics. I'm also interested in how we can represent brain signals—from low-dimensional trajectories to artificial neural networks and foundation models. At CHU Sainte-Justine, I collaborate on pediatric clinical EEG research, including questions about ADHD and epilepsy.</p>
    <p>A fan of <strong>open &amp; accessible science</strong>, and building shareable tools to lower research barriers. Working to foster fairness and equity within the scientific community.</p>
    <p>Originally from Sfax 🇹🇳, now based in <strong>Tiohtià:ke / Montréal</strong> 🇨🇦.</p>
  image: /images/main/01.jpg
  image_alt: Hamza Abdelhedi
  circular_image: true
  show_social_icons: true
  email: hamza.abdelhedi@umontreal.ca
  cta_button: Get in touch
  cta_button_link: /contact/
  works_button: What I'm working on
  works_button_link: /research/
  cv_button: Download CV
  cv_button_link: /assets/files/Hamza_Abdelhedi_CV.pdf

# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  show_spotlight:
    type: switch
    comment: Show rotating publication and media highlights below the portrait.
  phonetic:
    type: text
    comment: Phonetic pronunciation (e.g., HAM-za ab-del-HE-di)
  pronouns:
    type: text
    comment: Pronouns shown beside the pronunciation
  eyebrow:
    type: text
    comment: Short field and methods line above the name
  statement:
    type: text
    comment: One sentence stating the central research question
  position:
    type: text
    comment: Your title/position line
  tagline:
    type: textarea
    comment: One-line tagline summarizing your work/values
  circular_image:
    type: switch
  show_social_icons:
    type: switch
    comment: Show social icons from _data/links.yml
  email:
    type: email
    comment: Email address for contact icon
  cv_button:
    type: text
  cv_button_link:
    type: url
