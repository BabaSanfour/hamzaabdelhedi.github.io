preview:
  title: Hi 👋, I'm Hamza
  phonetic: HAM-za ab-del-HE-di
  pronouns: he/him
  pronouns_url: https://pronouns.org/he-him
  position: PhD student in Biomedical Engineering
  statement: I study brain dynamics and representations with M/EEG and computational models, investigate connections between brains and AI, and develop methods for understanding neural activity.
  description_html: >-
    <p>I combine recordings of brain activity (MEG/EEG) with computational models, including neural networks. In my PhD with <a href="https://psy.umontreal.ca/en/repertoire-departement/professeurs/professeur/in/in18916/sg/Karim%20Jerbi/">Prof. Karim Jerbi</a>, I study how changing evidence shapes decisions. I also collaborate on pediatric EEG research at <a href="https://recherche.chusj.org/en/Home">CHU Sainte-Justine</a>.</p>
    <p>I build and maintain open-source tools for analyzing brain signals, including <a href="/software/#coco-pipe">CoCo-PiPe</a> and <a href="/software/#mne-denoise">MNE-Denoise</a>, and contribute to packages across the <a href="/software/">MNE ecosystem</a>. I share practical methods through teaching, mentoring, and community work, with a focus on open, accessible science.</p>
    <p>At <a href="https://abundant-intelligences.net/">Abundant Intelligences</a>, I support AI development for low-resource and Indigenous-language applications and deliver technical workshops.</p>
    <p>Originally from Sfax 🇹🇳, now based in <strong>Tiohtià:ke / Montréal</strong> 🇨🇦.</p>
  image: /images/main/01.jpg
  image_alt: Hamza Abdelhedi
  circular_image: true
  show_social_icons: true
  email: hamza.abdelhedi@umontreal.ca
  cta_button: Explore my research
  cta_button_link: /research/
  works_button: Get in touch
  works_button_link: /contact/
  cv_button: CV (PDF)
  cv_button_link: /assets/files/Hamza_Abdelhedi_CV.pdf

# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  show_signal_motif:
    type: switch
    comment: Add a static decorative brain-signal trace above the greeting.
  show_spotlight:
    type: switch
    comment: Show rotating publication and media highlights below the portrait.
  phonetic:
    type: text
    comment: Phonetic pronunciation (e.g., HAM-za ab-del-HE-di)
  pronouns:
    type: text
    comment: Pronouns shown beside the pronunciation
  pronouns_url:
    type: url
    comment: Optional explanation link for the displayed pronouns
  eyebrow:
    type: text
    comment: Short field and methods line above the name
  statement:
    type: text
    comment: One sentence stating the central research question
  position:
    type: text
    comment: Your title/position line
  tagline:
    type: textarea
    comment: One-line tagline summarizing your work/values
  circular_image:
    type: switch
  show_social_icons:
    type: switch
    comment: Show social icons from _data/links.yml
  email:
    type: email
    comment: Email address for contact icon
  cv_button:
    type: text
  cv_button_link:
    type: url
