preview:
  title: Hamza Abdelhedi
  phonetic: HAM-za ab-del-HE-di
  position: PhD Student in Biomedical Engineering • Neuro-AI @ UdeM & Mila
  tagline: Exploring brains & AI, championing Open Science, and building community.
  description_html: >-
    <p>Interested in dynamical biological and artificial systems with a focus on 
    <strong>vision, decision-making, and brain disorders</strong>.</p>
