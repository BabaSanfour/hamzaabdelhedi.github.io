{% if site.data.links.social %}
<div class="social">
  <ul class="social__list list-reset">
    {% for social in site.data.links.social %}
    {% assign social_url = site.data.links[social.key] %}
    {% if social_url %}
    <li class="social__item">
      <a class="social__link" href="{{ social_url }}" target="_blank" rel="noopener" aria-label="{{ social.icon | downcase }} icon"><i class="ion ion-logo-{{ social.icon | downcase }}"></i></a>
    </li>
    {% endif %}
    {% endfor %}
  </ul>
</div>
{% endif %}
