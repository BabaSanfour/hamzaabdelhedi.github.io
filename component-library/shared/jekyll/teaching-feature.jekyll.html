{% assign teaching_visual = include.record.visual %}
{% if teaching_visual.src %}
<figure class="teaching-feature">
  <img class="teaching-feature__image" src="{{ teaching_visual.src | relative_url }}"{% if teaching_visual.sources %} srcset="{% for source in teaching_visual.sources %}{{ source.src | relative_url }} {{ source.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(min-width: 1200px) 430px, (min-width: 761px) 38vw, (min-width: 500px) 440px, calc(100vw - 32px)' }}"{% endif %} width="{{ teaching_visual.width }}" height="{{ teaching_visual.height }}" alt="{{ teaching_visual.alt | escape }}" loading="lazy" decoding="async">
  <figcaption class="teaching-feature__caption">
    <div>
      <p>{{ teaching_visual.caption | escape }}</p>
      {% if teaching_visual.credit %}<p class="teaching-feature__credit">Photo: {% if teaching_visual.credit_url %}<a href="{{ teaching_visual.credit_url }}">{{ teaching_visual.credit | escape }}</a>{% else %}{{ teaching_visual.credit | escape }}{% endif %}</p>{% endif %}
      <a href="{{ '/teaching/' | relative_url }}#{{ include.record.id }}">Explore this workshop <span aria-hidden="true">→</span></a>
    </div>
  </figcaption>
</figure>
{% endif %}
