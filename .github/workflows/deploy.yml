# Deploy Jekyll + Bookshop site to GitHub Pages
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from Actions tab

# Sets permissions of the GITHUB_TOKEN needed by the build job.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. Do NOT cancel in-progress runs as
# we want to allow these deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── CV source and PDF ─────────────────────────────────────────
      - name: Checkout CV source
        uses: actions/checkout@v4
        with:
          repository: BabaSanfour/cv-latex
          ref: main
          path: _cv-src

      - name: Record CV source revision
        working-directory: _cv-src
        run: |
          set -euo pipefail
          test -f main.tex
          echo "CV source revision: $(git rev-parse HEAD)"

      - name: Prepare fresh CV output
        run: |
          set -euo pipefail
          rm -f _cv-src/main.pdf
          test ! -e _cv-src/main.pdf

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: _cv-src

      - name: Verify compiled CV
        working-directory: _cv-src
        run: |
          set -euo pipefail
          test -s main.pdf
          test "$(head -c 5 main.pdf)" = "%PDF-"
          test "$(file --brief --mime-type main.pdf)" = "application/pdf"
          echo "Compiled CV: $(wc -c < main.pdf | tr -d ' ') bytes"

      - name: Copy and verify CV artifacts
        run: bash scripts/sync-cv-pdf.sh _cv-src/main.pdf site

      # ── Node.js (Bookshop) ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Bookshop live JavaScript
        run: npx bookshop-live -b ./component-library -o site/_cloudcannon/bookshop-live.js

      # ── Ruby (Jekyll) ─────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: site/Gemfile

      - name: Build Jekyll site
        run: bundle exec jekyll build --source site --trace
        env:
          BUNDLE_GEMFILE: site/Gemfile
          JEKYLL_ENV: production

      - name: Verify generated CV artifacts
        run: |
          set -euo pipefail
          test -s _site/assets/files/Hamza_Abdelhedi_CV.pdf
          test -s _site/Hamza_Abdelhedi_cv.pdf
          cmp -s _cv-src/main.pdf _site/assets/files/Hamza_Abdelhedi_CV.pdf
          cmp -s _cv-src/main.pdf _site/Hamza_Abdelhedi_cv.pdf
          if find _site \( -type d -name '_cv-src' -o -type f \( -name '*.tex' -o -name '*.aux' -o -name '*.log' -o -name '*.fls' -o -name '*.fdb_latexmk' -o -name '*.out' -o -name '*.synctex*' \) \) -print -quit | grep -q .; then
            echo 'Unexpected CV source or build file found in _site' >&2
            exit 1
          fi
          echo 'Generated CV artifacts match the freshly compiled PDF.'

      # ── Upload & Deploy ────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
